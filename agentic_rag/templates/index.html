<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface2: #222633;
      --border: #2e3548;
      --text: #e8eaef;
      --muted: #8b92a8;
      --accent: #5b8def;
      --accent-dim: #3d6fd4;
      --success: #3ecf8e;
      --warn: #e8b84a;
      --danger: #ef6b6b;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 100vh;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    .brand span { color: var(--accent); }
    .meta {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      word-break: break-all;
    }
    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .card h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .stat {
      background: var(--bg);
      border-radius: 6px;
      padding: 0.5rem 0.65rem;
    }
    .stat label { font-size: 0.65rem; color: var(--muted); display: block; }
    .stat strong { font-size: 1rem; font-family: "JetBrains Mono", monospace; }
    .upload-zone {
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(91, 141, 239, 0.06);
    }
    .upload-zone input { display: none; }
    .upload-zone p { font-size: 0.85rem; color: var(--muted); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.55rem 1rem;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-dim); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      width: 100%;
    }
    .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
    .btn-danger { background: rgba(239, 107, 107, 0.15); color: var(--danger); width: 100%; }
    .main {
      display: flex;
      flex-direction: column;
      max-height: 100vh;
    }
    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .chat-header h1 { font-size: 1rem; font-weight: 600; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      max-width: 100%;
    }
    .eval-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.65rem;
    }
    .tag {
      font-size: 0.65rem;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      background: var(--bg);
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
    }
    .tag.ok { color: var(--success); }
    .sources {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .sources h4 { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.5rem; }
    .source-item {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      font-family: "JetBrains Mono", monospace;
    }
    .composer {
      padding: 1rem 1.5rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .composer form {
      display: flex;
      gap: 0.65rem;
      align-items: flex-end;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    .composer textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }
    .toast.error { background: var(--danger); color: #fff; }
    .toast.success { background: var(--success); color: #0f1117; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Agentic <span>RAG</span></div>
      <p class="meta" id="meta-index">Index: {{ index_dir }}</p>
      <p class="meta" id="meta-collection">Qdrant: {{ collection_name }}</p>
      <p class="meta" id="meta-model">LLM: {{ llm_model }}</p>
      <p class="meta" id="meta-embed">Embed: {{ embedding_model }}</p>

      <div class="card">
        <h3>Index status</h3>
        <div class="stat-grid" id="stats">
          <div class="stat"><label>Vectors</label><strong id="s-vectors">—</strong></div>
          <div class="stat"><label>Parents</label><strong id="s-parents">—</strong></div>
          <div class="stat"><label>BM25</label><strong id="s-bm25">—</strong></div>
          <div class="stat"><label>Ready</label><strong id="s-ready">—</strong></div>
        </div>
        <button type="button" class="btn btn-ghost" style="margin-top:0.75rem" id="btn-refresh">Refresh status</button>
      </div>

      <div class="card">
        <h3>Ingest documents</h3>
        <label class="upload-zone" id="drop-zone">
          <input type="file" id="file-input" accept=".pdf,.docx" multiple />
          <p>Drop PDF or DOCX here<br />or click to browse</p>
        </label>
        <p class="meta" id="file-list" style="margin-top:0.5rem"></p>
        <button type="button" class="btn btn-primary" style="margin-top:0.75rem" id="btn-ingest" disabled>Ingest files</button>
      </div>

      <button type="button" class="btn btn-danger" id="btn-reset">Reset index</button>
    </aside>

    <main class="main">
      <header class="chat-header">
        <h1>Ask your documents</h1>
      </header>
      <div class="messages" id="messages">
        <div class="msg system">Upload documents in the sidebar, then ask a question.</div>
      </div>
      <div class="composer">
        <form id="query-form">
          <textarea id="question" rows="1" placeholder="Ask a question about your documents…" required></textarea>
          <button type="submit" class="btn btn-primary" id="btn-send" style="width:auto;min-width:100px">Send</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    const indexDir = {{ index_dir|tojson }};
    let pendingFiles = [];

    function toast(msg, type = "success") {
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    async function refreshStatus() {
      try {
        const res = await fetch(`/api/status?index_dir=${encodeURIComponent(indexDir)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Status failed");
        const s = data.status;
        document.getElementById("s-vectors").textContent = s.qdrant_points ?? 0;
        document.getElementById("s-parents").textContent = s.parent_chunks ?? 0;
        document.getElementById("s-bm25").textContent = s.bm25_documents ?? 0;
        const ready = (s.qdrant_points > 0 && s.parent_chunks > 0);
        document.getElementById("s-ready").textContent = ready ? "Yes" : "No";
        document.getElementById("s-ready").style.color = ready ? "var(--success)" : "var(--warn)";
      } catch (e) {
        toast(e.message, "error");
      }
    }

    function addMessage(role, text, extraHtml = "") {
      const box = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.innerHTML = text + extraHtml;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById("btn-refresh").addEventListener("click", refreshStatus);

    const dropZone = document.getElementById("drop-zone");
    const fileInput = document.getElementById("file-input");
    const fileList = document.getElementById("file-list");
    const btnIngest = document.getElementById("btn-ingest");

    function updateFileList() {
      fileList.textContent = pendingFiles.length
        ? pendingFiles.map(f => f.name).join(", ")
        : "";
      btnIngest.disabled = pendingFiles.length === 0;
    }

    function setFiles(files) {
      pendingFiles = [...files].filter(f => /\.(pdf|docx)$/i.test(f.name));
      updateFileList();
    }

    fileInput.addEventListener("change", () => setFiles(fileInput.files));
    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      setFiles(e.dataTransfer.files);
    });

    async function pollIngestJob(jobId) {
      const maxPolls = 600;
      for (let i = 0; i < maxPolls; i++) {
        await new Promise(r => setTimeout(r, 2000));
        const res = await fetch(`/api/ingest/${jobId}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Ingest status failed");
        const job = data.job;
        if (job.status === "running") continue;
        if (job.status === "failed") throw new Error(job.error || "Ingest failed");
        return job;
      }
      throw new Error("Ingest timed out — check server logs.");
    }

    btnIngest.addEventListener("click", async () => {
      if (!pendingFiles.length) return;
      btnIngest.disabled = true;
      btnIngest.innerHTML = '<span class="spinner"></span> Ingesting…';
      const fd = new FormData();
      fd.append("index_dir", indexDir);
      pendingFiles.forEach(f => fd.append("files", f));
      try {
        const res = await fetch("/api/ingest", { method: "POST", body: fd });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        addMessage("system", `Ingestion started for ${data.files.length} file(s)…`);
        const job = await pollIngestJob(data.job_id);
        const st = job.stats || {};
        const processed = st.files_processed ?? 0;
        const skipped = st.files_skipped ?? 0;
        toast(`Ingested ${processed} file(s), skipped ${skipped}`);
        pendingFiles = [];
        fileInput.value = "";
        updateFileList();
        await refreshStatus();
        addMessage("system", `Indexed ${st.child_chunks} child chunks from ${st.total_pages} pages.`);
      } catch (e) {
        toast(e.message, "error");
      } finally {
        btnIngest.disabled = pendingFiles.length === 0;
        btnIngest.textContent = "Ingest files";
      }
    });

    document.getElementById("btn-reset").addEventListener("click", async () => {
      if (!confirm("Delete all indexed data for this index?")) return;
      try {
        const res = await fetch("/api/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ index_dir: indexDir }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        toast("Index reset");
        await refreshStatus();
        addMessage("system", "Index was reset.");
      } catch (e) {
        toast(e.message, "error");
      }
    });

    document.getElementById("query-form").addEventListener("submit", async e => {
      e.preventDefault();
      const ta = document.getElementById("question");
      const q = ta.value.trim();
      if (!q) return;
      const btn = document.getElementById("btn-send");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      addMessage("user", escapeHtml(q));
      ta.value = "";
      try {
        const res = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q, index_dir: indexDir }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        const r = data.result;
        let tags = `<div class="eval-tags">`;
        tags += `<span class="tag ${r.is_successful ? "ok" : ""}">${r.is_successful ? "✓ pass" : "✗ fail"}</span>`;
        if (r.retrieval_decision) tags += `<span class="tag">${r.retrieval_decision}</span>`;
        if (r.support_grade) tags += `<span class="tag">${r.support_grade}</span>`;
        if (r.usefulness_score != null) tags += `<span class="tag">${r.usefulness_score}/5</span>`;
        if (r.num_retries) tags += `<span class="tag">retries ${r.num_retries}</span>`;
        tags += `</div>`;
        let sources = "";
        if (r.sources && r.sources.length) {
          sources = `<div class="sources"><h4>Sources</h4>`;
          r.sources.forEach((s, i) => {
            sources += `<div class="source-item">[${i+1}] ${escapeHtml(s.source_file)} p.${s.page ?? "?"}</div>`;
          });
          sources += `</div>`;
        }
        addMessage("assistant", escapeHtml(r.answer), tags + sources);
      } catch (err) {
        addMessage("system", escapeHtml(err.message));
        toast(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Send";
      }
    });

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    refreshStatus();
  </script>
</body>
</html>
